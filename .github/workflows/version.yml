name: version
on:
  release:
    types: [published]

jobs:
  update-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # required to access the full history and tags

      - name: Set up Git user
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Update Cargo.toml version from tag
        run: |
          TAG_NAME="${GITHUB_REF##*/}"
          echo "Tag name: $TAG_NAME"
          sed -i "s/^version = \".*\"/version = \"$TAG_NAME\"/" Cargo.toml

      - name: Commit and push changes
        run: |
          git add Cargo.toml
          git commit -m "chore: update Cargo.toml version to ${GITHUB_REF##*/}" || echo "No changes to commit"
          git push
